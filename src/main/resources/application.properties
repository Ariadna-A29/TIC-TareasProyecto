spring.application.name=bdd
spring.profiles.active=${SPRING_PROFILES_ACTIVE:lab}

# Capa JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway — Versionado de esquema (las migraciones viven en el repositorio)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging estructurado para consola
logging.pattern.console=%5p | %t | %c{1} | %m%n
